# ============================================================
#  KaamSaathi backend - application.properties
# ============================================================
spring.application.name=kaamsaathi
server.port=8080

# Never leak internal error details to the browser
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.compression.enabled=true
server.tomcat.max-swallow-size=2MB

# Spring Boot would otherwise print a random default password; we use JWT instead
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------------- DATABASE (default: H2 file DB, zero setup) ----------------
#spring.datasource.url=jdbc:h2:file:./data/kaamsaathi;AUTO_SERVER=TRUE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=false

# ---------------- DATABASE (MySQL) - comment the H2 block above and enable this ----------------
 spring.datasource.url=jdbc:mysql://localhost:3306/kaamsaathi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
 spring.datasource.username=root
 spring.datasource.password=${DB_PASSWORD:YourNewPassword123!}
 spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use "update" in development. In production use "validate" and manage the schema with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------- FILE UPLOAD ----------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
app.upload.dir=./uploads
app.upload.photo-max-bytes=2097152
app.upload.resume-max-bytes=5242880

# ---------------- JWT ----------------
# MUST be at least 32 characters. In production set the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-this-before-deploying-0123456789}
app.jwt.expiration-minutes=60

# ---------------- CORS (only needed if the HTML is NOT served by this app) ----------------
app.cors.allowed-origins=http://localhost:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

# ---------------- LOGIN (email + password) ----------------
# After this many wrong passwords the account is locked for lock-minutes
app.login.max-failed-attempts=5
app.login.lock-minutes=15

# ---------------- ADMIN ----------------
# Comma separated EMAILS that get ROLE_ADMIN after login, e.g. admin@example.com,boss@example.com
app.admin.emails=

# ---------------- RATE LIMIT (requests per minute per IP) ----------------
app.rate-limit.auth-per-minute=10
app.rate-limit.write-per-minute=15
app.rate-limit.read-per-minute=120

# ---------------- MISC ----------------
app.default-job-image=https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=800&q=80
logging.level.org.springframework.security=WARN
